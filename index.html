<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Calendar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500&family=Roboto:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <button class="icon-btn" id="menuBtn" aria-label="Main menu">
        <svg viewBox="0 0 24 24" width="24" height="24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
      </button>
      <!-- "Calendar" is a mode switch: Calendar / Action timeline -->
      <div class="mode-switch">
        <button class="logo mode-btn" id="modeBtn" type="button" aria-haspopup="menu" aria-expanded="false" title="Switch mode">
          <div class="logo-icon"><span id="logoDate">16</span></div>
          <span class="logo-text" id="modeLabel">Calendar</span>
          <svg class="mode-caret" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M7 10l5 5 5-5z"/></svg>
        </button>
        <div class="mode-menu" id="modeMenu" role="menu" hidden>
          <button role="menuitemradio" data-mode="calendar">
            <svg viewBox="0 0 24 24" width="20" height="20"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-2 .9-2 2v14a2 2 0 0 0 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2z"/></svg>
            <span><b>Calendar</b><small>Week and month views, editing</small></span>
          </button>
          <button role="menuitemradio" data-mode="timeline">
            <svg viewBox="0 0 24 24" width="20" height="20"><path d="M2 11h5.1a3 3 0 0 1 5.8 0h2.2a3 3 0 0 1 5.8 0H22v2h-1.1a3 3 0 0 1-5.8 0h-2.2a3 3 0 0 1-5.8 0H2z"/></svg>
            <span><b>Action timeline</b><small>What's now and what's next (view only)</small></span>
          </button>
        </div>
      </div>
    </div>
    <div class="topbar-center">
      <button class="today-btn" id="todayBtn">Today</button>
      <button class="icon-btn" id="prevBtn" aria-label="Previous week">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
      </button>
      <button class="icon-btn" id="nextBtn" aria-label="Next week">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M10 6 8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
      </button>
      <h1 class="range-title" id="rangeTitle"></h1>
    </div>
    <div class="topbar-right">
      <div class="view-switch">
        <button class="view-pill" id="viewBtn" aria-haspopup="menu" aria-expanded="false">
          <span id="viewLabel">Week</span> <svg viewBox="0 0 24 24" width="18" height="18"><path d="M7 10l5 5 5-5z"/></svg>
        </button>
        <div class="view-menu" id="viewMenu" role="menu" hidden>
          <button role="menuitem" data-view="week">Week <span class="kbd">W</span></button>
          <button role="menuitem" data-view="month">Month <span class="kbd">M</span></button>
        </div>
      </div>
      <div class="avatar">T</div>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <!-- Natural-language input replaces the "Create" button -->
      <form class="ai-box" id="aiForm" autocomplete="off">
        <div class="ai-input-wrap">
          <svg class="ai-spark" viewBox="0 0 24 24" width="20" height="20"><path d="M12 2l1.9 5.6L19.5 9.5l-5.6 1.9L12 17l-1.9-5.6L4.5 9.5l5.6-1.9z M19 14l.9 2.6 2.6.9-2.6.9L19 21l-.9-2.6-2.6-.9 2.6-.9z"/></svg>
          <textarea id="aiInput" rows="1" placeholder="Add or edit events" aria-label="Describe an event to add or change"></textarea>
          <button type="submit" class="ai-send" id="aiSend" aria-label="Send">
            <svg viewBox="0 0 24 24" width="18" height="18"><path d="M2.01 21 23 12 2.01 3 2 10l15 2-15 2z"/></svg>
          </button>
        </div>
        <div class="ai-status" id="aiStatus" aria-live="polite"></div>
        <div class="ai-hints" id="aiHints">
          <button type="button" class="hint">Lunch with Sam tomorrow at noon</button>
          <button type="button" class="hint">Move my gym session to Friday 6pm</button>
          <button type="button" class="hint">Cancel everything on Wednesday</button>
        </div>
      </form>

      <div class="mini-cal">
        <div class="mini-head">
          <span id="miniTitle"></span>
          <div>
            <button class="icon-btn small" id="miniPrev" aria-label="Previous month">
              <svg viewBox="0 0 24 24" width="18" height="18"><path d="M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
            </button>
            <button class="icon-btn small" id="miniNext" aria-label="Next month">
              <svg viewBox="0 0 24 24" width="18" height="18"><path d="M10 6 8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
            </button>
          </div>
        </div>
        <div class="mini-grid" id="miniGrid"></div>
      </div>

      <section class="tasks" aria-label="Tasks">
        <div class="tasks-head">
          <span>Tasks</span>
          <button class="icon-btn small" id="taskAdd" aria-label="Add a task" title="Add a task">
            <svg viewBox="0 0 24 24" width="20" height="20"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
          </button>
        </div>
        <ul class="task-list" id="taskList"></ul>
        <div class="task-empty" id="taskEmpty" hidden>No tasks. Add one with + or the box above.</div>
        <div class="task-tip">Drag a task onto the calendar to schedule it.</div>
      </section>

      <section class="my-cals" aria-label="My calendars">
        <div class="my-cals-head">
          <span>My calendars</span>
          <button class="icon-btn small" id="calAdd" aria-label="Create a calendar" title="Create a calendar">
            <svg viewBox="0 0 24 24" width="20" height="20"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
          </button>
        </div>
        <ul class="cal-list" id="calList"></ul>
      </section>
    </aside>

    <main class="main" id="main" data-view="week">
      <div class="month-view" id="monthView">
        <div class="month-head" id="monthHead"></div>
        <div class="month-grid" id="monthGrid"></div>
      </div>
      <div class="week-head" id="weekHead"></div>
      <div class="week-body" id="weekBody">
        <div class="week-grid" id="weekGrid"></div>
      </div>
    </main>
  </div>

  <!-- Action timeline mode: read-only view of now / next on a draggable line -->
  <section class="timeline" id="timeline" aria-label="Action timeline" hidden>
    <div class="tl-stage" id="tlStage">
      <div class="tl-line" aria-hidden="true"></div>
      <div class="tl-track" id="tlTrack"></div>
      <div class="tl-countdown" id="tlCountdown" aria-live="polite"></div>
      <div class="tl-allday" id="tlAllday"></div>
      <div class="tl-nav">
        <div class="tl-daylabel" id="tlDayLabel"></div>
        <button class="tl-now" id="tlNow" type="button" hidden>Now</button>
        <div class="tl-navbtns">
          <button class="tl-navbtn" id="tlPrev" type="button" aria-label="Previous day" title="Previous day">
            <svg viewBox="0 0 24 24" width="22" height="22"><path d="M16 5v14L5 12z"/></svg>
          </button>
          <button class="tl-navbtn" id="tlNext" type="button" aria-label="Next day" title="Next day">
            <svg viewBox="0 0 24 24" width="22" height="22"><path d="M8 5v14l11-7z"/></svg>
          </button>
        </div>
      </div>
      <div class="tl-empty" id="tlEmpty" hidden></div>
      <div class="tl-hint">Drag the line to look ahead · view only — switch to Calendar to make changes</div>
    </div>
  </section>

  <!-- Shown while the sidebar is closed: a round + that opens the AI input bar in a floating card. -->
  <div class="quick-add" id="quickAdd" hidden>
    <button class="qa-fab" id="qaFab" type="button" aria-label="Create" title="Create">
      <svg viewBox="0 0 24 24" width="28" height="28"><path d="M20 13h-7v7h-2v-7H4v-2h7V4h2v7h7v2z"/></svg>
    </button>
    <div class="qa-card" id="qaCard" hidden></div>
  </div>

  <div class="popover" id="popover" hidden></div>
  <div class="toast" id="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
